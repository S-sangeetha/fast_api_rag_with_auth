<div class="container py-4">
    <div class="card border-0 shadow-lg rounded-4 chat-container mx-auto">
        <!-- Header -->
        <div
            class="card-header bg-white border-bottom p-3 rounded-top-4 d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-2">
                <div class="bg-primary text-white rounded-circle p-2 d-flex align-items-center justify-content-center"
                    style="width: 40px; height: 40px;">
                    <i class="bi bi-robot fs-5"></i>
                </div>
                <div>
                    <h5 class="mb-0 fw-bold">Chat Assistant</h5>
                    <small class="text-muted">
                        <i class="bi bi-circle-fill text-success"></i> Online
                    </small>
                </div>
            </div>
        </div>

        <!-- Chat Messages Window -->
        <div class="card-body p-4 chat-body overflow-y-auto" #scrollContainer>
            <!-- Empty Chat -->
            <div *ngIf="messages.length === 0 && !isLoading" class="text-center text-muted my-5 py-4">
                <i class="bi bi-chat-dots fs-1 text-primary opacity-50"></i>
                <h6 class="mt-3 fw-semibold text-dark">Start a new conversation</h6>
                <p class="small text-secondary">Upload a file or type your question below to begin.</p>
            </div>

            <!-- Messages Stream -->
            <div *ngFor="let message of messages" class="mb-3">
                <!-- User Message -->
                <div *ngIf="message.type === 'user'" class="d-flex justify-content-end">
                    <div class="bg-primary text-white px-3 py-2 rounded-4 shadow-sm"
                        style="max-width: 75%; white-space: pre-wrap;">
                        {{ message.text }}
                    </div>
                </div>

                <!-- Bot Message -->
                <div *ngIf="message.type === 'bot'" class="d-flex justify-content-start">
                    <div class="d-flex align-items-start gap-2">
                        <!-- Bot Icon -->
                        <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center"
                            style="width: 32px; height: 32px; flex-shrink: 0;">
                            <i class="bi bi-robot"></i>
                        </div>
                        <!-- Bot Message Content -->
                        <div class="bg-light border px-3 py-2 rounded-4 shadow-sm text-dark"
                            style="max-width: 75%; white-space: pre-wrap;">
                            {{ message.text }}
                        </div>
                    </div>
                </div>
            </div>

            <!-- Bot Thinking / Loading Indicator -->
            <div *ngIf="isLoading" class="mb-3">
                <div class="d-flex justify-content-start">
                    <div class="d-flex align-items-center gap-2">
                        <!-- Bot Icon -->
                        <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center"
                            style="width: 32px; height: 32px; flex-shrink: 0;">
                            <i class="bi bi-robot"></i>
                        </div>
                        <!-- Loading Bubble -->
                        <div
                            class="bg-light border px-3 py-2 rounded-4 shadow-sm text-muted d-flex align-items-center gap-2">
                            <span class="spinner-grow spinner-grow-sm text-primary" role="status"
                                aria-hidden="true"></span>
                            <span class="fst-italic small">Thinking...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Input Footer -->
        <div class="card-footer bg-white border-top p-3 rounded-bottom-4">
            <form class="d-flex align-items-center gap-2" (submit)="$event.preventDefault()">
                <!-- File Upload -->
                <input type="file" id="fileUpload" class="d-none" (change)="uploadFile($event)">
                <label for="fileUpload"
                    class="btn btn-light border rounded-circle p-2 d-flex align-items-center justify-content-center text-secondary shadow-sm"
                    style="width: 42px; height: 42px; cursor: pointer;" title=" Upload
                    File">
                    <i class="bi bi-paperclip fs-5"></i>
                </label>

                <!-- Question Input -->
                <input #question type="text" class="form-control rounded-pill px-3 py-2 border bg-light shadow-none"
                    placeholder="Type your question here..." [disabled]="isLoading"
                    (keyup.enter)="sendMessage(question.value); question.value = ''">

                <!-- Send Button -->
                <button type="button"
                    class="btn btn-primary rounded-circle p-2 d-flex align-items-center justify-content-center shadow-sm"
                    style="width: 42px; height: 42px;" title="Send" [disabled]="isLoading"
                    (click)="sendMessage(question.value); question.value = ''">
                    <i *ngIf="!isLoading" class="bi bi-send-fill fs-6"></i>
                    <span *ngIf="isLoading" class="spinner-border spinner-border-sm" role="status"></span>
                </button>
            </form>
        </div>
    </div>
</div>
